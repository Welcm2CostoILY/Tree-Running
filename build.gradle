plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	maven { url = 'https://repo1.maven.org/maven2' }
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.treerunning'
version = '1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Unit tests cover the planner only; they don't start the client.
test {
	filter {
		includeTestsMatching 'com.treerunning.core.*'
		includeTestsMatching 'com.treerunning.RunStateTest'
		includeTestsMatching 'com.treerunning.data.*'
	}
}

// Launches RuneLite in developer mode with this plugin loaded:  ./gradlew runClient
tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Runs RuneLite with the Tree Running plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.treerunning.TreeRunningPluginTest'
	jvmArgs '-ea'
	args '--developer-mode'
}


// Dev tool: renders the side panel tabs to PNGs (build/snapshots) without starting the client.
tasks.register('panelSnapshot', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.treerunning.PanelSnapshot'
	systemProperty 'java.awt.headless', 'true'
	systemProperty 'snapshotScale', System.getProperty('snapshotScale', '1')
}

// Dev tool: exports crop/route data and reference results for the HTML preview.
tasks.register('exportPreviewData', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.treerunning.ExportPreviewData'
	args 'build/preview-data.json'
}
